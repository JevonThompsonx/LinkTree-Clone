# Generated by zLeafNinja/ci-workflows — do not hand-edit.
#
# Secrets: every push and PR (a leaked key is a real defect).
# Dependency CVEs: weekly only. Scanning every push made every repo red for
# advisories unrelated to the change, which trains people to ignore the tick.
name: security
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          set -eu
          V=8.30.1
          curl -sSfL -o /tmp/gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

  deps:
    name: trivy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - name: trivy
        run: |
          set -eu
          V=0.76.2
          curl -sSfL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          /tmp/trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --quiet .
